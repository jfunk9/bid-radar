name: Run RFP Scraper

on:
  # Manual trigger — the "Refresh" button
  workflow_dispatch:

  # Auto-run on pushes that change scraper code/deps/workflow
  push:
    branches: [main]
    paths:
      - 'mn_bid_scraper.py'
      - 'requirements.txt'
      - '.github/workflows/scrape.yml'

  # Auto-run every weekday at 7:00 AM Central (12:00 UTC)
  schedule:
    - cron: '0 12 * * 1-5'

# Artifact-based GitHub Pages deploy — CI never commits to main.
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write   # failure-notification step files/threads an issue

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run scraper
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: |
          python -c "
          import mn_bid_scraper as s
          import os
          # Output goes to repo root so it lands in the Pages artifact
          s.GITHUB_REPO_DIR = os.getcwd()
          s.OUTPUT_FILE = os.path.join(os.getcwd(), 'mn_bids_report.txt')
          s.run()
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # AUDIT 2026-08-06 #7 (added 2026-08-14): the scraper can exit 2 on a
      # degraded run (guards keep the previous dashboard live) -- but for three
      # audit cycles NOTHING TOLD ANYONE. This step turns any failed run into a
      # repo issue: it lands in Jason's GitHub notifications AND doubles as the
      # durable run-failure history the repo never had. Repeat failures thread
      # into the same open issue instead of spamming new ones.
      - name: Report failure as an issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Scraper run FAILED (auto-filed) - dashboard held on last good version";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Run failed at ${new Date().toISOString()} - ${url}\n\n` +
              "The published dashboard was left on the previous good version. " +
              "Open the run log above for the PUBLISH ABORTED reason (collapse / majority errors / selector rot).";
            const {data: open} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 50});
            const hit = open.find(i => i.title === title);
            if (hit) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: hit.number, body});
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body});
            }

  # 2026-10-27: GitHub disables a public repo's schedule after 60 days with no
  # pushes, and this repo only gets pushed when the scraper code changes.
  # Re-enabling the workflow through the API counts as activity and resets that
  # clock. Its own job, so a failed scrape still keeps the schedule alive.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/scrape.yml/enable"

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
